name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            PW="$(openssl rand -hex 16)"
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -keypass "$PW" \
              -alias slimmer -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Slimmer"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=slimmer" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_type == 'tag' && github.ref_name || '1.0.0-dev' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Slimmer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Slimmer.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app + dmg
        working-directory: macos
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; fi
          export VERSION="${TAG#v}"; [ -z "$VERSION" ] && export VERSION="1.0.0"
          ./scripts/build-dmg.sh
          cp build/Slimmer.dmg ../Slimmer.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Slimmer.dmg

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check relay sources
        run: |
          cd relay/node && npm install --silent && node --check server.mjs
          cd ../worker && node --check src/index.js

  release:
    needs: [android, macos, relay]
    if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Slimmer ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            dist/Slimmer.apk
            dist/Slimmer.dmg
          body: |
            ## 설치
            - **Android 10+**: `Slimmer.apk` 설치
            - **macOS 13+**: `Slimmer.dmg` 열고 Applications로 드래그.
              서명되지 않은 앱이라 처음엔 Finder에서 **우클릭 → 열기** 하거나
              `xattr -dr com.apple.quarantine /Applications/Slimmer.app` 실행.
            - 외부 네트워크에서 쓰려면 `relay/`의 릴레이 서버를 배포하세요 (README 참고).
